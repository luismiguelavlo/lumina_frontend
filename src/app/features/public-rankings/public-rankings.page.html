<div
  class="group/design-root relative flex min-h-screen w-full flex-col overflow-x-hidden bg-background-light font-display text-slate-900 dark:bg-background-dark dark:text-slate-100"
>
  <app-lum-landing-site-header />
  <div class="layout-container flex grow flex-col pt-20">
    <div class="flex flex-1 justify-center px-4 py-5 md:px-10 lg:px-40">
      <div class="layout-content-container flex w-full max-w-[1200px] flex-1 flex-col">
        <app-lum-public-ranking-intro
          heading="Top 3 Lectores"
          subheading="Celebra a nuestros mejores lectores"
        />
        <app-lum-public-ranking-podium [leaders]="store.podiumLeaders()" />
        <div class="mx-auto mb-10 flex w-full max-w-2xl flex-col gap-6 px-4">
          <app-lum-public-rank-lookup-card
            inputId="public-rank-lookup"
            title="Encuentra tu posición en el ranking"
            placeholder="Buscar por nombre, código o email"
            submitLabel="Consultar mi puesto"
            [control]="store.lookupControl"
            [suggestions]="store.suggestions()"
            [loadingSuggestions]="store.loadingSuggestions()"
            [loadingRanking]="store.isLoadingRanking()"
            [errorMessage]="store.lookupError()"
            (consult)="store.onLookupConsult()"
            (suggestionPick)="store.pickStudent($event)"
          />
        </div>
        <div class="mx-auto flex w-full max-w-2xl flex-col gap-3 px-4 pb-10">
          <app-lum-public-ranking-result-row [result]="store.lookupResult()" />
        </div>
      </div>
    </div>
  </div>
</div>
