<header
  class="relative mb-12 overflow-hidden rounded-2xl border border-white/50 bg-[color-mix(in_oklab,var(--color-background-light)_70%,transparent)] p-8 shadow-[0_4px_30px_rgba(255,178,71,0.1)] backdrop-blur-md dark:border-white/10 dark:bg-[color-mix(in_oklab,var(--color-background-dark)_55%,transparent)]"
>
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent"
  ></div>
  <div class="relative z-10">
    <h1 class="font-display mb-2 text-[1.875rem] font-bold text-slate-900 dark:text-slate-100">
      {{ title() }}
    </h1>
    <p class="max-w-2xl text-[0.875rem] text-slate-600 dark:text-slate-400">
      {{ description() }}
    </p>
  </div>
</header>
