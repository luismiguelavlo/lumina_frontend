<nav
  aria-label="Main navigation"
  class="fixed top-0 z-50 mx-auto flex h-20 w-full max-w-full items-center justify-between border-b border-white/20 bg-stone-50/70 px-6 shadow-[0_4px_30px_rgba(255,178,71,0.1)] backdrop-blur-lg sm:px-8 dark:border-slate-700/30 dark:bg-stone-900/70"
>
  <div class="flex items-center gap-8">
    <a
      class="font-display text-2xl font-bold tracking-tighter text-primary"
      routerLink="/"
      >{{ brandLabel() }}</a
    >
    <div class="hidden items-center gap-6 md:flex">
      <a
        class="border-b-2 border-transparent pb-1 text-sm font-semibold tracking-wide text-stone-600 transition-colors hover:text-amber-600 dark:text-stone-300 dark:hover:text-amber-400"
        routerLink="/catalog"
        routerLinkActive="border-amber-500 text-amber-700 dark:border-amber-500 dark:text-amber-400"
        [routerLinkActiveOptions]="{ exact: true }"
        >Catalog</a
      >
      <a
        class="rounded-lg px-3 py-2 text-sm tracking-wide text-stone-600 transition-all duration-200 ease-in-out hover:bg-amber-50/50 hover:text-amber-500 dark:text-stone-300 dark:hover:bg-amber-900/20"
        routerLink="/rankings"
        >Ranking</a
      >
    </div>
  </div>
  <div class="flex items-center gap-6">
    <label class="relative hidden sm:block">
      <span class="sr-only">{{ searchPlaceholder() }}</span>
      <app-lum-icon
        [extraClass]="'pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-sm text-slate-500 dark:text-slate-400'"
        [name]="'search'"
      />
      <input
        class="w-64 rounded-full border-none bg-stone-100 py-2 pr-4 pl-10 text-sm text-slate-900 shadow-[inset_2px_2px_5px_rgb(0_0_0/0.05)] transition-all placeholder:text-slate-500 focus:ring-2 focus:ring-primary/50 focus:outline-none dark:bg-stone-800 dark:text-slate-100 dark:placeholder:text-slate-400"
        type="search"
        [formControl]="searchControl()"
        [placeholder]="searchPlaceholder()"
      />
    </label>
    <a
      class="rounded-full bg-primary px-6 py-2 text-sm font-semibold tracking-wide text-white shadow-primary-glow transition-colors hover:bg-amber-400/90"
      routerLink="/auth/login"
      >Sign In</a
    >
  </div>
</nav>
