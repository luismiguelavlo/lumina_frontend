<div class="relative">
  <span class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2 text-slate-500 dark:text-slate-400">
    <app-lum-icon [extraClass]="'text-[22px]'" [name]="icon()" />
  </span>
  <input
    class="w-full rounded-xl border-none bg-background-light py-3 pr-4 pl-12 text-sm text-slate-900 shadow-neomorph-inset transition-all placeholder:text-slate-500/70 focus:ring-2 focus:ring-primary/50 focus:outline-none dark:bg-background-dark dark:text-slate-100 dark:shadow-neo-icon-active-dark dark:placeholder:text-slate-500"
    type="search"
    [attr.aria-label]="ariaLabel()"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
  />
</div>
