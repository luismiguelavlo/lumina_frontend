<app-lum-admin-glass [paddingClass]="'p-6'" [roundedClass]="'rounded-xl'">
  <div class="flex flex-col">
    <div class="mb-6 flex items-center justify-between gap-3">
      <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100">{{ sectionTitle() }}</h3>
      <app-lum-icon [extraClass]="'text-red-500 dark:text-red-400'" [name]="'warning'" />
    </div>

    @if (items().length === 0) {
      <p class="py-6 text-center text-sm text-slate-500 dark:text-slate-400">{{ emptyLabel() }}</p>
    } @else {
      <div class="flex-1 space-y-4 overflow-y-auto pr-1">
        @for (row of items(); track row.loanId) {
          <div
            class="rounded-xl border border-red-200/60 bg-red-50/50 px-4 py-3 dark:border-red-900/40 dark:bg-red-950/20"
          >
            <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ row.studentName }}</p>
            @if (row.studentCode) {
              <p class="mt-0.5 font-mono text-xs text-slate-500 dark:text-slate-400">{{ row.studentCode }}</p>
            }
            <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{ row.bookTitle }}</p>
            <div class="mt-2 flex flex-wrap items-center gap-2 text-xs">
              <span
                class="rounded-md bg-red-100 px-2 py-0.5 font-medium text-red-700 dark:bg-red-900/40 dark:text-red-300"
              >
                {{ row.daysOverdueLabel }}
              </span>
              <span class="text-slate-500 dark:text-slate-400">{{ row.dueDateLabel }}</span>
            </div>
          </div>
        }
      </div>
    }

    <button
      class="mt-4 w-full rounded-lg border border-slate-200 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
      type="button"
      (click)="onViewAll()"
    >
      {{ viewAllLabel() }}
    </button>
  </div>
</app-lum-admin-glass>
