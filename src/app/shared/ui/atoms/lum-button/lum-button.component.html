<button
  class="flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-xl text-lg font-bold transition-all duration-200 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0 disabled:hover:brightness-100"
  [class.bg-primary]="variant() === 'primary'"
  [class.text-text-dark]="variant() === 'primary'"
  [class.shadow-neumorphic-lift]="variant() === 'primary'"
  [class.enabled:hover:-translate-y-0.5]="variant() === 'primary'"
  [class.enabled:hover:shadow-neumorphic-lift-hover]="variant() === 'primary'"
  [class.enabled:hover:brightness-105]="variant() === 'primary'"
  [class.active:shadow-neumorphic-inner]="variant() === 'primary'"
  [class.active:translate-y-0]="variant() === 'primary'"
  [disabled]="disabled()"
  [type]="type()"
>
  <span>{{ label() }}</span>
  @if (endIcon(); as icon) {
    <app-lum-icon [extraClass]="'text-xl'" [name]="icon" />
  }
</button>
