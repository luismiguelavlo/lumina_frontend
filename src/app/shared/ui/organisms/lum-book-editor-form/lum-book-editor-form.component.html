<form
  class="rounded-2xl bg-background-light p-8 shadow-neumorphic dark:bg-background-dark dark:shadow-[0_10px_28px_rgb(0_0_0/0.35)]"
  [formGroup]="form()"
  (ngSubmit)="$event.preventDefault()"
>
  <h2
    class="mb-6 border-b border-slate-200 pb-2 text-xl font-semibold text-slate-800 dark:border-slate-700 dark:text-slate-200"
  >
    Basic information
  </h2>

  <div class="mb-6 grid grid-cols-1 gap-6 md:grid-cols-2">
    <app-lum-neo-input-field label="Title" [control]="$any(form().get('title'))" />
    <app-lum-neo-input-field label="Author" [control]="$any(form().get('author'))" />
  </div>

  <div class="mb-6 grid grid-cols-1 gap-6 md:grid-cols-2">
    <app-lum-neo-input-field
      [control]="$any(form().get('isbn'))"
      [mono]="true"
      label="ISBN"
    />
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-lum-neo-input-field
        inputType="number"
        label="Publication year"
        [control]="$any(form().get('publicationYear'))"
      />
      <app-lum-neo-input-field inputType="number" label="Pages" [control]="$any(form().get('pages'))" />
    </div>
  </div>

  <div class="mb-8">
    <app-lum-neo-textarea-field
      label="Synopsis"
      [control]="$any(form().get('synopsis'))"
      [rows]="4"
    />
  </div>

  <h2
    class="mb-6 border-b border-slate-200 pb-2 text-xl font-semibold text-slate-800 dark:border-slate-700 dark:text-slate-200"
  >
    Categorization
  </h2>

  <div class="mb-4 grid grid-cols-1 gap-6 md:grid-cols-2">
    <app-lum-neo-select-field
      label="Genre"
      [control]="$any(form().get('genre'))"
      [options]="genreOptions()"
    />
    <app-lum-neo-input-field label="Location / shelf" [control]="$any(form().get('locationShelf'))" />
  </div>
</form>
