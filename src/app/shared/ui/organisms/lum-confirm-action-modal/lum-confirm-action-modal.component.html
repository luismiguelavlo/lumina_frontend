<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/25 p-4 backdrop-blur-sm dark:bg-black/55"
  role="presentation"
  (click)="onBackdropClick($event)"
>
  <div
    class="w-full max-w-md rounded-2xl border border-white/70 bg-white/50 p-6 shadow-2xl backdrop-blur-md dark:border-white/15 dark:bg-slate-900/85"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-action-title"
    (click)="$event.stopPropagation()"
  >
    <div class="mb-5 flex items-start gap-3">
      <div
        class="mt-0.5 flex size-10 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600 dark:bg-amber-950/50 dark:text-amber-300"
      >
        <app-lum-icon [extraClass]="'text-xl'" [name]="'help'" />
      </div>
      <div>
        <h3 id="confirm-action-title" class="text-lg font-bold text-slate-900 dark:text-slate-100">
          {{ title() }}
        </h3>
        <p class="mt-1 text-sm font-medium text-slate-600 dark:text-slate-300">
          {{ message() }}
        </p>
      </div>
    </div>

    <div class="mt-6 flex items-center justify-end gap-3">
      <button
        type="button"
        class="rounded-xl px-5 py-2.5 text-sm font-bold text-slate-600 transition-colors hover:bg-white/50 disabled:cursor-not-allowed disabled:opacity-50 dark:text-slate-300 dark:hover:bg-white/10"
        [disabled]="isLoading()"
        (click)="cancelClick.emit()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-primary/30 transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="isLoading()"
        (click)="confirmClick.emit()"
      >
        @if (isLoading()) {
          Processing...
        } @else {
          {{ confirmLabel() }}
        }
      </button>
    </div>
  </div>
</div>
