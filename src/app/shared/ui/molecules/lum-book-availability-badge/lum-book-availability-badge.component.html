@if (availability() === 'available') {
  <div
    class="absolute top-3 left-3 flex items-center gap-1.5 rounded-full bg-background-light px-3 py-1 shadow-neo-light-raised dark:bg-slate-800 dark:shadow-neo-icon-dark"
  >
    <div class="h-2 w-2 rounded-full bg-green-500"></div>
    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">{{
      'books.availability.available' | t
    }}</span>
  </div>
} @else {
  <div
    class="absolute top-3 left-3 flex items-center gap-1.5 rounded-full border border-primary/30 bg-primary/20 px-3 py-1 backdrop-blur-sm"
  >
    <div class="h-2 w-2 rounded-full bg-primary"></div>
    <span class="text-xs font-bold text-slate-800 dark:text-slate-100">{{
      'books.availability.borrowed' | t
    }}</span>
  </div>
}
