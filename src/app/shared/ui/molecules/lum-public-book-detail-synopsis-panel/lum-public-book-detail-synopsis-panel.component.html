<div
  class="group relative overflow-hidden rounded-2xl border border-white/50 bg-background-light/70 p-6 shadow-[0_8px_32px_0_rgb(31_38_135/0.07)] backdrop-blur-md dark:border-white/10 dark:bg-background-dark/60"
>
  <div
    aria-hidden="true"
    class="absolute -top-20 -right-20 h-48 w-48 rounded-full bg-primary/10 blur-2xl transition-colors duration-700 group-hover:bg-primary/15"
  ></div>
  <h2
    class="relative z-10 mb-4 flex items-center gap-2 font-display text-xl font-semibold text-slate-900 dark:text-slate-100"
  >
    <app-lum-icon [extraClass]="'text-primary/70'" [name]="'format_quote'" />
    {{ heading() }}
  </h2>
  <p
    class="relative z-10 text-[15px] leading-relaxed text-slate-600 dark:text-slate-300"
    >{{ body() }}</p
  >
</div>
