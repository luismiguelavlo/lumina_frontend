<div
  class="flex flex-col items-center justify-center gap-2 rounded-xl border border-white/40 bg-stone-100 p-4 shadow-neumorphic dark:border-white/10 dark:bg-stone-800/80 dark:shadow-[0_10px_28px_rgb(0_0_0/0.35)]"
>
  <app-lum-icon [extraClass]="'text-3xl text-primary/40 dark:text-primary/50'" [name]="iconName()" />
  <span class="text-xs tracking-widest text-slate-500 uppercase dark:text-slate-400">{{ label() }}</span>
  <span class="font-display text-lg font-semibold text-slate-900 dark:text-slate-100">{{ value() }}</span>
</div>
