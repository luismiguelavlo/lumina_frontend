<label class="flex min-h-11 w-full min-w-40 max-w-xl flex-col">
  <div
    class="flex h-11 w-full flex-1 items-stretch rounded-xl border border-white/80 bg-background-light shadow-neomorph-inset dark:border-white/10 dark:bg-surface-dark dark:shadow-neo-icon-active-dark"
  >
    <div class="flex items-center justify-center rounded-l-xl pl-4 text-slate-500 dark:text-slate-400">
      <app-lum-icon [name]="'search'" />
    </div>
    <input
      class="min-w-0 flex-1 rounded-xl rounded-l-none border-none bg-transparent px-4 py-2 pl-2 text-sm font-medium text-slate-900 placeholder:text-slate-500 focus:ring-0 focus:outline-none dark:text-slate-100 dark:placeholder:text-slate-500"
      type="search"
      [attr.aria-label]="ariaLabel()"
      [placeholder]="placeholder()"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
    />
  </div>
</label>
