<header class="mb-8 flex min-w-0 items-center justify-between gap-4">
  <div class="min-w-0 flex-1">
    <h2 class="text-3xl font-bold text-slate-900 dark:text-slate-100">{{ title() }}</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ subtitle() }}</p>
  </div>

  <div class="flex items-center gap-4">
    <button
      class="relative flex h-10 w-10 items-center justify-center rounded-full border border-white/30 bg-white/40 text-slate-600 shadow-glass backdrop-blur-md transition-colors hover:text-primary dark:border-white/[0.05] dark:bg-[color-mix(in_oklab,var(--color-background-dark)_40%,transparent)] dark:text-slate-300 dark:shadow-[0_8px_32px_0_rgb(0_0_0/0.3)] dark:hover:text-primary"
      type="button"
      [attr.aria-label]="'dashboard.notificationsAria' | t"
      (click)="onNotificationsClick()"
    >
      <app-lum-icon [name]="'notifications'" />
      @if (showNotificationDot()) {
        <span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-red-500"></span>
      }
    </button>
  </div>
</header>
