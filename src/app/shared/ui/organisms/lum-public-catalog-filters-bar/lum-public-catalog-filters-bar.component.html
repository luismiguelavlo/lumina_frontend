<section aria-label="Catalog filters" class="mb-8 flex flex-wrap items-center justify-between gap-4">
  <div class="flex flex-wrap gap-2">
    @for (opt of filterOptions(); track opt.id) {
      <app-lum-filter-pill-button
        [label]="opt.label"
        [selected]="opt.id === selectedFilterId()"
        (pillSelected)="pickFilter(opt.id)"
      />
    }
  </div>
  <div class="flex items-center gap-2 text-[0.875rem] text-slate-600 dark:text-slate-400">
    <app-lum-icon [extraClass]="'text-sm'" [name]="'filter_list'" />
    <span>Sort by:</span>
    <label class="sr-only" for="public-catalog-sort">Sort catalog</label>
    <select
      class="cursor-pointer border-none bg-transparent py-0 pr-6 pl-1 text-sm font-medium text-slate-900 focus:ring-0 focus:outline-none dark:text-slate-100"
      id="public-catalog-sort"
      [value]="selectedSortId()"
      (change)="onSortSelect($event)"
    >
      @for (opt of sortOptions(); track opt.id) {
        <option [value]="opt.id">{{ opt.label }}</option>
      }
    </select>
  </div>
</section>
