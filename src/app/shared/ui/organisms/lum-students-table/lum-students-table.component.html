<div
  class="relative mb-8 overflow-hidden rounded-2xl border border-white/60 bg-white/40 shadow-glass backdrop-blur-md dark:border-white/10 dark:bg-white/5"
>
  <div class="overflow-x-auto">
    <table class="w-full border-collapse text-left">
      <thead>
        <tr class="border-b border-slate-200/50 dark:border-slate-700/50">
          <th
            class="px-6 py-5 text-xs font-semibold tracking-wider text-slate-500 uppercase dark:text-slate-400"
          >
            Student
          </th>
          <th
            class="hidden px-6 py-5 text-xs font-semibold tracking-wider text-slate-500 uppercase md:table-cell dark:text-slate-400"
          >
            Status
          </th>
          <th
            class="hidden px-6 py-5 text-xs font-semibold tracking-wider text-slate-500 uppercase lg:table-cell dark:text-slate-400"
          >
            Date applied
          </th>
          <th
            class="hidden px-6 py-5 text-xs font-semibold tracking-wider text-slate-500 uppercase xl:table-cell dark:text-slate-400"
          >
            Reason
          </th>
          <th
            class="px-6 py-5 text-right text-xs font-semibold tracking-wider text-slate-500 uppercase dark:text-slate-400"
          >
            Action
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200/50 dark:divide-slate-700/50">
        @for (row of rows(); track row.patronId) {
          <tr class="group transition-colors hover:bg-white/30 dark:hover:bg-white/5">
            <td class="px-6 py-4">
              <app-lum-table-student-identity-cell
                [detailLine]="'ID: ' + row.patronId"
                [initials]="initialsFromName(row.name)"
                [name]="row.name"
              />
            </td>
            <td class="hidden px-6 py-4 md:table-cell">
              <app-lum-student-status-chip [status]="row.status" />
            </td>
            <td
              class="hidden px-6 py-4 text-sm font-medium text-slate-600 lg:table-cell dark:text-slate-300"
              [class.text-slate-400]="!row.dateApplied"
              [class.dark:text-slate-500]="!row.dateApplied"
            >
              {{ row.dateApplied ?? '—' }}
            </td>
            <td
              class="hidden px-6 py-4 text-sm text-slate-600 xl:table-cell dark:text-slate-300"
              [class.text-slate-400]="!row.reason"
              [class.dark:text-slate-500]="!row.reason"
            >
              {{ row.reason ?? '—' }}
            </td>
            <td class="px-6 py-4 text-right">
              <button
                class="inline-flex h-9 items-center justify-center rounded-lg border border-primary/20 bg-white/50 px-4 text-sm font-bold text-primary shadow-sm transition-colors hover:bg-primary hover:text-white dark:border-primary/30 dark:bg-white/10 dark:hover:bg-primary"
                type="button"
                (click)="onViewProfile(row)"
              >
                View profile
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
