<app-lum-admin-glass [paddingClass]="'p-6'" [roundedClass]="'rounded-xl'">
  <div class="flex flex-col">
    <div class="mb-6 flex items-center justify-between">
      <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100">{{ sectionTitle() }}</h3>
    </div>

    <div class="flex-1 space-y-6 overflow-y-auto pr-2">
      @for (item of items(); track $index) {
        <div class="flex gap-4">
          <div class="relative">
            <div
              class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full"
              [class]="toneIconWrap(item.tone)"
            >
              <app-lum-icon [extraClass]="'text-[16px]'" [name]="item.icon" />
            </div>
            @if (item.showConnector) {
              <div
                class="absolute top-8 bottom-[-24px] left-1/2 w-[2px] -translate-x-1/2 bg-slate-200 dark:bg-slate-700"
              ></div>
            }
          </div>
          <div>
            <p class="text-sm font-medium text-slate-900 dark:text-slate-100">{{ item.title }}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">{{ item.subtitle }}</p>
            <p class="mt-1 text-xs text-slate-400">{{ item.time }}</p>
          </div>
        </div>
      }
    </div>

    <button
      class="mt-4 w-full rounded-lg border border-slate-200 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
      type="button"
      (click)="onViewAll()"
    >
      {{ viewAllLabel() }}
    </button>
  </div>
</app-lum-admin-glass>
