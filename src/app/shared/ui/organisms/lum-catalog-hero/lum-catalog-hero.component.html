<div
  class="flex flex-col items-start justify-between gap-6 md:flex-row md:items-center"
>
  <div class="flex min-w-0 flex-col gap-2">
    <h1 class="text-4xl font-black leading-tight tracking-tight text-slate-900 dark:text-slate-100">
      {{ title() }}
    </h1>
    <p class="font-medium text-primary/80">{{ tagline() }}</p>
  </div>

  <app-lum-catalog-search
    [placeholder]="searchPlaceholder()"
    [query]="searchQuery()"
    (queryChange)="queryChange.emit($event)"
  />
</div>
