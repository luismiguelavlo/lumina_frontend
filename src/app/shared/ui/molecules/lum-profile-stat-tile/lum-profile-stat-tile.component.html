<div
  class="group relative flex flex-col gap-2 overflow-hidden rounded-2xl bg-background-light p-5 shadow-neomorph-raised dark:bg-background-dark dark:shadow-[10px_10px_20px_#1a140b,-10px_-10px_20px_#2c2213]"
>
  <div class="pointer-events-none absolute -top-4 -right-4 transition-colors" [class]="blobClass(accent())">
    <app-lum-icon [extraClass]="'text-6xl'" [name]="icon()" />
  </div>
  <p class="z-10 text-sm font-medium text-slate-500 dark:text-slate-400">{{ label() }}</p>
  <div class="z-10 flex items-baseline gap-1">
    <p [class]="valueClass(accent())">{{ value() }}</p>
    @if (valueSuffix(); as s) {
      <span class="text-sm text-slate-500 dark:text-slate-400">{{ s }}</span>
    }
  </div>
</div>
