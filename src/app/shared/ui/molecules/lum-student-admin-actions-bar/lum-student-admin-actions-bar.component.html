<div
  class="flex flex-col gap-4 rounded-2xl border border-white/60 bg-white/45 p-4 shadow-glass backdrop-blur-md sm:flex-row sm:items-center sm:justify-between dark:border-white/10 dark:bg-[color-mix(in_oklab,var(--color-background-dark)_45%,transparent)] dark:shadow-[0_8px_32px_0_rgb(0_0_0/0.2)]"
>
  <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">{{ heading() }}</p>
  <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:justify-end sm:gap-3">
    <button
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 rounded-xl border border-slate-300/80 bg-background-light px-4 text-sm font-bold text-slate-800 shadow-neomorph-raised transition-colors hover:border-primary/40 hover:text-primary dark:border-slate-600 dark:bg-background-dark dark:text-slate-100 dark:shadow-[10px_10px_20px_#1a140b,-10px_-10px_20px_#2c2213] dark:hover:border-primary/50 dark:hover:text-primary"
      type="button"
      (click)="emitSanction()"
    >
      <app-lum-icon [extraClass]="'text-lg'" [name]="'gavel'" />
      {{ sanctionLabel() }}
    </button>
    <button
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 rounded-xl border border-slate-300/80 bg-background-light px-4 text-sm font-bold text-slate-800 shadow-neomorph-raised transition-colors hover:border-primary/40 hover:text-primary dark:border-slate-600 dark:bg-background-dark dark:text-slate-100 dark:shadow-[10px_10px_20px_#1a140b,-10px_-10px_20px_#2c2213] dark:hover:border-primary/50 dark:hover:text-primary"
      type="button"
      (click)="emitFine()"
    >
      <app-lum-icon [extraClass]="'text-lg'" [name]="'payments'" />
      {{ fineLabel() }}
    </button>
    <button
      class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 rounded-xl border border-red-300/80 bg-red-50 px-4 text-sm font-bold text-red-700 shadow-neomorph-raised transition-colors hover:bg-red-100 disabled:cursor-not-allowed disabled:opacity-60 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300 dark:shadow-[10px_10px_20px_#1a140b,-10px_-10px_20px_#2c2213] dark:hover:bg-red-900/50"
      type="button"
      [disabled]="deactivateLoading()"
      (click)="emitDeactivate()"
    >
      <app-lum-icon [extraClass]="'text-lg'" [name]="'person_off'" />
      @if (deactivateLoading()) {
        Deactivating...
      } @else {
        {{ deactivateLabel() }}
      }
    </button>
  </div>
</div>
