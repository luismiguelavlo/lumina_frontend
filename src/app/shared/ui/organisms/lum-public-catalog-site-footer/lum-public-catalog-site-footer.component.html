<footer
  aria-label="Site footer"
  class="mt-auto flex w-full flex-col items-center justify-between space-y-4 border-t border-stone-200/50 bg-stone-100 px-12 py-12 dark:border-stone-800/50 dark:bg-stone-950 md:flex-row md:space-y-0"
>
  <div class="font-display text-lg font-semibold text-stone-800 dark:text-stone-200">
    {{ brandLabel() }}
  </div>
  <div class="flex flex-wrap items-center justify-center gap-6">
    @for (link of links(); track link.href) {
      <a
        class="font-display text-xs font-light text-stone-500 opacity-80 transition-colors hover:text-amber-500 hover:opacity-100 dark:text-stone-400 dark:hover:text-amber-400"
        [href]="link.href"
        >{{ link.label }}</a
      >
    }
  </div>
  <div class="font-display text-xs font-light text-amber-600 dark:text-amber-400">
    {{ copyright() }}
  </div>
</footer>
