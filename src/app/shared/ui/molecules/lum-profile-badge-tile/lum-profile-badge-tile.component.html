@let adm = adminMode();
@let isBusy = busy();

@if (locked()) {
  <div
    class="flex flex-col items-center gap-2"
    [class.cursor-pointer]="adm && !isBusy"
    [class.cursor-not-allowed]="!adm || isBusy"
    [class.opacity-60]="isBusy"
    [class.opacity-50]="!adm"
    [class.grayscale]="!adm"
    [class.hover:opacity-100]="!adm"
    [class.hover:grayscale-0]="!adm"
    [attr.title]="tooltip()"
    [attr.role]="adm ? 'button' : null"
    [attr.tabindex]="adm && !isBusy ? 0 : null"
    (click)="onActivate($event)"
    (keydown.enter)="onActivate($event)"
    (keydown.space)="onActivate($event)"
  >
    <div
      class="relative flex h-16 w-16 items-center justify-center rounded-full border-2 border-slate-300 bg-slate-200 shadow-neumorphic-inset dark:border-slate-700 dark:bg-slate-800 dark:shadow-[inset_5px_5px_10px_#1a140b,inset_-5px_-5px_10px_#2c2213]"
    >
      @if (isBusy) {
        <app-lum-icon [extraClass]="'text-2xl animate-spin text-slate-500'" [name]="'sync'" />
      } @else {
        <app-lum-icon [extraClass]="'text-3xl text-slate-400'" [name]="'lock'" />
      }
    </div>
    <p class="text-center text-xs font-medium text-slate-500 dark:text-slate-400">{{ label() }}</p>
    @if (adm) {
      <span class="text-[0.65rem] font-semibold tracking-wide text-primary uppercase">Tap to award</span>
    }
  </div>
} @else {
  <div
    class="group flex flex-col items-center gap-2"
    [class.cursor-pointer]="adm && !isBusy"
    [class.cursor-default]="!adm || isBusy"
    [class.opacity-60]="isBusy"
    [attr.title]="tooltip()"
    [attr.role]="adm ? 'button' : null"
    [attr.tabindex]="adm && !isBusy ? 0 : null"
    (click)="onActivate($event)"
    (keydown.enter)="onActivate($event)"
    (keydown.space)="onActivate($event)"
  >
    <div
      class="relative flex h-16 w-16 items-center justify-center rounded-full border-2 border-primary/50 bg-gradient-to-br from-primary/20 to-primary/5 shadow-[0_0_15px_rgba(255,178,71,0.3)] transition-all group-hover:shadow-[0_0_20px_rgba(255,178,71,0.5)]"
    >
      @if (isBusy) {
        <app-lum-icon [extraClass]="'text-2xl animate-spin text-primary'" [name]="'sync'" />
      } @else {
        <app-lum-icon [extraClass]="'text-3xl text-primary'" [name]="icon()" />
      }
    </div>
    <p class="text-center text-xs font-semibold text-slate-700 dark:text-slate-300">{{ label() }}</p>
    @if (adm) {
      <span class="text-[0.65rem] font-semibold tracking-wide text-slate-500 uppercase dark:text-slate-400"
        >Tap to remove</span
      >
    }
  </div>
}
