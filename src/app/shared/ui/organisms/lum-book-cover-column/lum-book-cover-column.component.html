<div
  class="mx-auto flex w-full max-w-[320px] shrink-0 flex-col gap-6 self-start lg:mx-0 lg:w-72 lg:max-w-[min(100%,18rem)]"
>
  <div
    class="rounded-3xl bg-white p-5 shadow-neumorphic dark:bg-slate-900 dark:shadow-[0_12px_32px_rgb(0_0_0/0.45)]"
  >
    <div
      class="rounded-2xl bg-[#ece8e2] p-4 shadow-[inset_0_1px_2px_rgb(0_0_0/0.06)] dark:bg-slate-800/90 dark:shadow-inner"
    >
      <div
        class="group relative mx-auto aspect-[2/3] w-full max-w-[220px] overflow-hidden rounded-xl bg-cover bg-center shadow-sm ring-1 ring-black/5 dark:ring-white/10"
        role="img"
        [attr.aria-label]="coverAlt()"
        [style.background-image]="'url(' + coverUrl() + ')'"
      >
        <div
          class="absolute inset-0 flex items-end justify-center bg-gradient-to-t from-black/50 to-transparent p-3 opacity-0 transition-opacity group-hover:opacity-100"
          [class.opacity-100]="isUploadingCover()"
        >
          <button
            class="flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-900 shadow-md transition-colors hover:bg-primary hover:text-white disabled:cursor-not-allowed disabled:opacity-70 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-primary"
            type="button"
            [disabled]="isUploadingCover()"
            (click)="openPicker()"
          >
            <app-lum-icon [extraClass]="'text-[18px]'" [name]="'photo_camera'" />
            @if (isUploadingCover()) {
              {{ 'upload.uploading' | t }}
            } @else {
              {{ 'bookDetail.cover.change' | t }}
            }
          </button>
        </div>
      </div>
      @if (localError(); as err) {
        <p class="mt-3 text-center text-xs font-medium text-red-600 dark:text-red-300" role="alert">
          {{ err }}
        </p>
      }
    </div>
  </div>

  <input
    #fileInput
    type="file"
    class="sr-only"
    accept="image/jpeg,image/png,image/webp,image/gif"
    [disabled]="isUploadingCover()"
    (change)="onFileChange($event)"
  />

  <div
    class="rounded-3xl bg-white p-6 shadow-neumorphic dark:bg-slate-900 dark:shadow-[0_12px_32px_rgb(0_0_0/0.45)]"
  >
    <h3 class="mb-5 text-lg font-bold text-slate-900 dark:text-slate-100">{{
      'bookDetail.status.title' | t
    }}</h3>

    <div
      class="mb-6 flex flex-col items-center gap-2 border-b border-slate-100 pb-5 text-center dark:border-slate-800"
    >
      @if (availability() === 'available') {
        <div class="flex items-center justify-center gap-2.5">
          <div class="h-2.5 w-2.5 shrink-0 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.45)]"></div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ statusLabel() }}</span>
        </div>
      } @else {
        <div class="flex items-center gap-2.5">
          <div class="h-2.5 w-2.5 shrink-0 rounded-full bg-primary shadow-primary-glow"></div>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ statusLabel() }}</span>
        </div>
      }
    </div>

    <div class="space-y-3">
      <div class="flex items-center justify-between gap-3 text-sm">
        <span class="text-slate-500 dark:text-slate-400">{{ 'bookDetail.status.totalCopies' | t }}</span>
        <span class="text-base font-bold tabular-nums text-slate-900 dark:text-slate-100">{{
          totalCopies()
        }}</span>
      </div>
      <div class="flex items-center justify-between gap-3 text-sm">
        <span class="text-slate-500 dark:text-slate-400">{{ 'bookDetail.status.checkedOut' | t }}</span>
        <span class="text-base font-bold tabular-nums text-slate-900 dark:text-slate-100">{{
          checkedOut()
        }}</span>
      </div>
    </div>
  </div>
</div>
