<a
  class="flex flex-col rounded-xl bg-background-light p-4 no-underline shadow-catalog-card transition-transform hover:-translate-y-1 dark:bg-slate-900/80 dark:shadow-[0_10px_30px_rgb(0_0_0/0.45)]"
  [routerLink]="['/admin/books', book().id]"
>
  <div
    class="relative mb-4 aspect-[3/4] rounded-lg bg-cover bg-center shadow-md"
    role="presentation"
    [attr.aria-label]="book().coverAlt"
    [style.background-image]="'url(' + book().coverUrl + ')'"
  >
    <app-lum-book-availability-badge [availability]="book().availability" />
  </div>

  <h3 class="mb-1 line-clamp-1 text-lg font-bold leading-tight text-slate-900 dark:text-slate-100">
    {{ book().title }}
  </h3>
  <p class="mb-3 text-sm font-medium text-slate-500 dark:text-slate-400">{{ book().author }}</p>

  <div class="mt-auto flex items-center justify-between">
    <span
      class="rounded bg-slate-100 px-2 py-1 font-mono text-xs text-slate-400 dark:bg-slate-800 dark:text-slate-400"
      >{{ book().sku }}</span
    >
    <span class="text-xs font-semibold text-primary">View details</span>
  </div>
</a>
