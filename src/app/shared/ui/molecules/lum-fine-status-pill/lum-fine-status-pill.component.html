@switch (status()) {
  @case ('pending') {
    <span
      class="inline-flex items-center rounded-full border border-amber-200 bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-800 dark:border-amber-800/50 dark:bg-amber-900/30 dark:text-amber-200"
    >
      {{ 'fines.status.pending' | t }}
    </span>
  }
  @case ('paid') {
    <span
      class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-800 dark:border-emerald-800/50 dark:bg-emerald-900/30 dark:text-emerald-200"
    >
      {{ 'fines.status.paid' | t }}
    </span>
  }
  @case ('waived') {
    <span
      class="inline-flex items-center rounded-full border border-slate-200 bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300"
    >
      {{ 'fines.status.waived' | t }}
    </span>
  }
}
