<div
  class="w-full rounded-xl border border-white/40 bg-background-light/60 p-1 shadow-sm backdrop-blur-md dark:border-white/10 dark:bg-background-dark/50 md:w-96"
>
  <label class="flex h-12 w-full items-center gap-3 px-4">
    <app-lum-icon [extraClass]="'text-primary'" [name]="'search'" />
    <input
      class="w-full flex-1 border-none bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-500"
      type="search"
      [attr.aria-label]="ariaLabel()"
      [placeholder]="placeholder()"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
    />
  </label>
</div>
