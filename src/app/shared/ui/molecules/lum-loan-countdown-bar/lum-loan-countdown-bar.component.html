<div class="flex max-w-[250px] flex-col gap-2">
  <div class="flex items-center justify-between">
    <span [class]="daysLabelClass(urgency())">{{ daysLeftLabel() }}</span>
    <span class="text-xs font-bold text-slate-500 dark:text-slate-400">{{ clampPercent() }}%</span>
  </div>
  <div
    class="h-2 w-full overflow-hidden rounded-full shadow-neomorph-inset dark:shadow-neo-icon-active-dark"
  >
    <div class="h-full min-w-0 transition-[width]" [class]="barFillClass(urgency())" [style.width.%]="clampPercent()"></div>
  </div>
</div>
