<article
  class="group relative flex h-full flex-col rounded-xl border bg-background-light p-4 shadow-neumorphic transition-transform duration-300 hover:-translate-y-1 dark:bg-background-dark dark:shadow-[0_10px_28px_rgb(0_0_0/0.35)]"
  [class]="book().cardBorderClass ?? 'border-white/50 dark:border-white/10'"
>
  @if (book().isNewArrival) {
    <div class="absolute -top-3 -right-3 z-10">
      <span
        class="rounded-full bg-primary px-2 py-1 text-[0.65rem] font-bold tracking-wider text-white uppercase shadow-primary-glow"
      >
        New Arrival
      </span>
    </div>
  }

  <div
    class="relative mb-4 aspect-[2/3] w-full overflow-hidden rounded-lg bg-stone-200 shadow-md dark:bg-stone-800"
  >
    <img
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      [alt]="book().coverAlt"
      [src]="book().coverUrl"
    />

    @if (book().showBookmark) {
      <div
        class="absolute top-2 right-2 rounded-full bg-background-light/90 p-1 shadow-sm backdrop-blur-sm dark:bg-background-dark/90"
      >
        <app-lum-icon [extraClass]="'text-base text-primary'" [name]="'bookmark'" />
      </div>
    }

    <div
      class="pointer-events-none absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 backdrop-blur-[2px] transition-opacity duration-300 group-hover:pointer-events-auto group-hover:opacity-100"
    >
      <a
        class="pointer-events-auto translate-y-4 rounded-full bg-primary px-4 py-2 text-xs font-semibold text-white no-underline shadow-primary-glow transition-transform duration-300 group-hover:translate-y-0"
        [routerLink]="['/catalog', book().id]"
        (click)="$event.stopPropagation()"
      >
        View Details
      </a>
    </div>
  </div>

  <div class="flex grow flex-col">
    <span [class]="categoryClasses()">{{ book().categoryLabel }}</span>
    <h2
      class="mb-1 line-clamp-2 text-[1.125rem] font-semibold leading-tight text-slate-900 dark:text-slate-100"
    >
      {{ book().title }}
    </h2>
    <p class="mb-4 text-[0.875rem] text-slate-600 dark:text-slate-400">{{ book().author }}</p>

    <div class="mt-auto flex items-center justify-between">
      @if (book().availability === 'available') {
        <span
          class="inline-flex items-center gap-1 rounded-md bg-stone-100 px-2 py-1 text-[0.75rem] text-slate-600 dark:bg-stone-800 dark:text-slate-300"
        >
          <app-lum-icon [extraClass]="'text-sm'" [name]="'menu_book'" />
          Available
        </span>
      } @else {
        <span
          class="inline-flex items-center gap-1 rounded-md bg-red-100/80 px-2 py-1 text-[0.75rem] text-red-700 dark:bg-red-950/50 dark:text-red-300"
        >
          <app-lum-icon [extraClass]="'text-sm'" [name]="'schedule'" />
          Checked Out
        </span>
      }
    </div>
  </div>
</article>
