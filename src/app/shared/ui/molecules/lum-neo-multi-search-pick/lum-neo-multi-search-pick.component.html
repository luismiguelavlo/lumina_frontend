<div class="flex flex-col gap-2">
  <app-lum-neo-field-label [text]="label()" />

  @if (selectedChips().length > 0) {
    <ul class="flex flex-wrap gap-2" aria-label="Selected items">
      @for (chip of selectedChips(); track chip.id) {
        <li>
          <span
            class="inline-flex max-w-full items-center gap-1 rounded-full bg-primary/15 px-3 py-1 text-xs font-semibold text-slate-800 dark:bg-primary/25 dark:text-slate-100"
          >
            <span class="truncate">{{ chip.label }}</span>
            <button
              type="button"
              class="flex size-5 shrink-0 items-center justify-center rounded-full text-slate-600 transition-colors hover:bg-white/60 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
              [attr.aria-label]="'Remove ' + chip.label"
              (click)="removeId(chip.id)"
            >
              <app-lum-icon [extraClass]="'text-[0.875rem]'" [name]="'close'" />
            </button>
          </span>
        </li>
      }
    </ul>
  }

  <div class="relative">
    <span class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400 dark:text-slate-500">
      <app-lum-icon [extraClass]="'text-sm'" [name]="'search'" />
    </span>
    <input
      class="h-11 w-full rounded-lg border-none bg-background-light py-2 pr-3 pl-10 text-sm text-slate-800 shadow-neumorphic-inset transition-all focus:ring-2 focus:ring-primary focus:outline-none dark:bg-background-dark dark:text-slate-200 dark:shadow-neo-icon-active-dark"
      type="search"
      [attr.aria-label]="'Filter ' + label()"
      [placeholder]="searchPlaceholder()"
      [value]="searchText()"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  <ul
    class="max-h-48 space-y-0.5 overflow-y-auto rounded-xl border border-slate-200/80 bg-white/60 p-1 dark:border-slate-700/80 dark:bg-slate-900/50"
    role="group"
    [attr.aria-label]="label()"
  >
    @for (o of filteredOptions(); track o.id) {
      <li>
        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition-colors hover:bg-primary/10 dark:hover:bg-primary/15"
          role="checkbox"
          [attr.aria-checked]="isSelected(o.id)"
          (click)="toggle(o.id)"
        >
          <span
            class="flex size-5 shrink-0 items-center justify-center rounded border border-slate-300 bg-background-light text-xs font-bold dark:border-slate-600 dark:bg-background-dark"
            aria-hidden="true"
          >
            @if (isSelected(o.id)) {
              <app-lum-icon [extraClass]="'text-primary text-sm'" [name]="'check'" />
            }
          </span>
          <span class="min-w-0 flex-1 font-medium text-slate-900 dark:text-slate-100">{{ o.label }}</span>
        </button>
      </li>
    } @empty {
      <li class="px-3 py-6 text-center text-sm text-slate-500 dark:text-slate-400">{{ emptyListHint() }}</li>
    }
  </ul>
</div>
